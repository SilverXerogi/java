
services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    container_name: bookstore-db
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      # Сохраняем данные БД при перезапуске
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore-network

  # Приложение
  app:
    build: .  # Собирает образ из Dockerfile, находящегося в текущей директории (где pom.xml)
    container_name: bookstore-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # Переменные среды для подключения к БД
      # Эти переменные будут доступны в Spring приложении
      DB_URL: jdbc:postgresql://db:5432/bookstore
      DB_USERNAME: postgres
      DB_PASSWORD: 12345
    networks:
      - bookstore-network

# Определяем именованный volume для БД
volumes:
  postgres_data:

# Определяем сеть для связи контейнеров
networks:
  bookstore-network:
    driver: bridge